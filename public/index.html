<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo CivicAPI Race ID Test</title><style>body{font:16px system-ui;background:#101426;color:#f6f4ff;max-width:850px;margin:35px auto;padding:16px}button{background:#8c7aff;color:white;border:0;padding:14px 20px;border-radius:9px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202640;padding:16px;border-radius:10px}</style><h1>💙 Milo's CivicAPI Race-ID Test v2</h1><p>Three sequential Kentucky race-ID requests. No nationwide search. Results show vote totals and provider timestamps.</p><button id="run">Run three checks</button><pre id="out">Ready.</pre><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');out.textContent='Running three checks (up to 36 seconds)…';try{const r=await fetch('/api/probe',{cache:'no-store'});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};</script></html>
