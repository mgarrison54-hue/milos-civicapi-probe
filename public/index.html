<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo's CivicAPI Connection Test</title><style>body{font:16px system-ui;background:#0e1024;color:#f5f4ff;max-width:760px;margin:48px auto;padding:0 20px}button{background:#6954ba;color:white;border:0;padding:14px 20px;border-radius:8px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#201b3d;padding:18px;border-radius:8px}small{color:#c8c4df}</style><h1>Milo's CivicAPI Connection Test</h1><p>Tests the known Kentucky Senate race (ID 87174) and a targeted Kentucky election search from a separate Cloudflare Worker. Does not modify the existing dashboard.</p><button id="run">Run two tests</button><p><small>Allow up to 25 seconds. No automatic polling.</small></p><pre id="output">Press the button to start.</pre><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#output');out.textContent='Testing…';try{const r=await fetch('/api/probe',{cache:'no-store'});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};</script></html>
